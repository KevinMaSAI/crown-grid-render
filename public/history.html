<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史记录与回放</title><link rel="stylesheet" href="/classic.css"><style>body{overflow:auto}main{max-width:1000px;margin:30px auto;padding:16px}a{color:#ccc}#records{display:grid;gap:10px}article{border:1px solid #666;padding:12px}#board{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));width:max-content;margin:20px auto}#board .cell{width:var(--cell);height:var(--cell);font-size:12px}#mapWrap{overflow:auto;max-height:70vh}#controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}input[type=range]{flex:1;min-width:160px}select{width:auto}#scoreText{white-space:pre-wrap}</style><main><a href="/">返回游戏</a><h1>历史记录 / 回放</h1><p id="status" role="status">加载中…</p><section id="history"><button id="refresh">刷新记录</button><p>本机已归档的对局；新对局包含真人、Bot 对战。记录达到存储上限后将停止保存，不自动删除。</p><div id="records"></div></section><section id="viewer" hidden><h2 id="title"></h2><p id="meta"></p><div id="controls"><button id="toggle">播放</button><button id="prev">上一步</button><button id="next">下一步</button><label>速度 <select id="rate"><option>1</option><option>2</option><option>4</option><option>8</option><option>16</option></select></label><select id="pov" aria-label="回放视角"><option value="-1">全图</option></select><input id="seek" type="range" min="0" value="0" aria-label="跳转回合"><span id="turnText"></span><button id="back">返回历史</button></div><p id="scoreText"></p><div id="mapWrap"><div id="board" role="grid" aria-label="回放地图"></div></div></section></main><script src="/history.js"></script></html>
